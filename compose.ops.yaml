services:
  mysql:
    image: ${EQA_OPS_MYSQL_IMAGE:?exact MySQL image required}
    pull_policy: never
    command: ["mysqld", "--port=3307", "--mysqlx=OFF"]
    env_file: ["${EQA_OPS_STACK_DIR}/mysql.env"]
    environment:
      MYSQL_DATABASE: eqa_v1
    volumes:
      - mysql_data:/var/lib/mysql
      - ${EQA_OPS_STACK_DIR}/00_identity.sql:/docker-entrypoint-initdb.d/00_identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h127.0.0.1 -P3307 -uroot -e 'SELECT 1' >/dev/null"]
      start_period: 60s
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [private]
  bootstrap:
    image: ${EQA_OPS_APP_IMAGE:?exact app image required}
    pull_policy: never
    profiles: [tools]
    network_mode: service:mysql
    env_file: ["${EQA_OPS_STACK_DIR}/bootstrap.env"]
    environment:
      EQA_DB_HOST: 127.0.0.1
      EQA_DB_PORT: "3307"
    command: ["python", "scripts/bootstrap_data.py", "--manifest", "/receipts/dataset-manifest.json"]
    volumes: ["${EQA_OPS_STACK_DIR}/init:/receipts"]
  integration:
    image: ${EQA_OPS_APP_IMAGE:?exact app image required}
    pull_policy: never
    profiles: [tools]
    network_mode: service:mysql
    env_file: ["${EQA_OPS_STACK_DIR}/runtime.env"]
    environment:
      EQA_DB_HOST: 127.0.0.1
      EQA_DB_PORT: "3307"
      EQA_INTEGRATION: "1"
      EQA_ENABLE_PAID_API: "0"
      EQA_PROVIDER: mock
    command: ["python", "scripts/ops_deploy.py", "container-oracle"]
  app:
    image: ${EQA_OPS_APP_IMAGE:?exact app image required}
    pull_policy: never
    env_file: ["${EQA_OPS_STACK_DIR}/runtime.env"]
    environment:
      EQA_DB_HOST: mysql
      EQA_DB_PORT: "3307"
      EQA_OPS_PROVIDER_DELAY_SECONDS: "1"
      EQA_OPS_PROVIDER_ERROR: "0"
      EQA_ENABLE_PAID_API: "0"
      EQA_PROVIDER: mock
    ports: ["127.0.0.1:${EQA_OPS_HTTP_PORT:?HTTP port required}:8011"]
    volumes: ["${EQA_OPS_STACK_DIR}/state:/app/.local"]
    stop_grace_period: 75s
    networks: [private]
networks:
  private:
    internal: true
volumes:
  mysql_data:
