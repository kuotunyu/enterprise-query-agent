name: eqa_v1
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${EQA_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${EQA_BOOTSTRAP_PASSWORD:?Set EQA_BOOTSTRAP_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eqa_v1
    volumes:
      - eqa_mysql_data:/var/lib/mysql
      - ./db/bootstrap/00_identity.sql:/docker-entrypoint-initdb.d/00_identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      start_period: 180s
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  eqa_mysql_data:
