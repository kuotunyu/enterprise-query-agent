<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歷史交易查詢工作台</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><p class="eyebrow">OLIST · 歷史資料工作台</p><h1>把問題，查成有依據的答案。</h1></div><span id="mode" class="badge">載入模式</span></header>
<section class="context" aria-label="資料範圍"><p id="dataset">正在確認資料集</p><p id="coverage"></p><label>相對日期基準 as_of_date <input id="asof" type="date" required></label></section>
<div class="workspace"><section class="ask"><h2>查詢問題</h2><p class="muted">使用購買年月與業務指標。營收口徑不明時會先澄清。</p><form id="form"><label for="question">你想了解什麼？</label><textarea id="question" required maxlength="2000" rows="4" placeholder="例如：2018年7月GMV按品類"></textarea><div class="actions"><button id="submit" type="submit">查詢</button><button id="cancel" type="button" class="secondary">取消執行</button><button id="new" type="button" class="secondary">新任務</button></div></form><p id="status" role="status" aria-live="polite">選擇示例或輸入問題開始。</p><div id="clarification" hidden><h3>請補充口徑或期間</h3><div id="options"></div><form id="clarify-form"><label for="reply">澄清回覆</label><input id="reply" required maxlength="500"><button type="submit">確認並查詢</button></form></div><h3>六個開發示例</h3><p class="muted">Deterministic mock 流程示範，不是模型評估成績。</p><div id="examples" class="examples"></div></section>
<section class="answer" aria-label="查詢答案"><div class="answer-heading"><h2>答案與依據</h2><span id="result-status"></span></div><p id="message">查詢完成後，這裡會呈現數字、採用口徑與 SQL 證據。</p><div id="facts" class="facts"></div><div class="table-wrap"><table id="table"></table></div><div id="definition"></div><p id="population"></p><p id="period"></p><p id="answer-coverage"></p><ul id="limits"></ul><details><summary>查看查詢證據與執行用量</summary><pre id="evidence"></pre></details></section></div><footer>金額單位 BRL · 歷史資料，不是即時營運 · 所有結果文字皆以純文字呈現</footer></main><script src="/static/app.js" defer></script></body></html>
